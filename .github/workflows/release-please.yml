name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use the "simple" release type since this is not a code package
          # (no Python/Node/etc package version to bump).
          # release-please will manage CHANGELOG.md and create GitHub releases
          # from Conventional Commits.
          release-type: simple
